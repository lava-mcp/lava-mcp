name: release images

# Build and publish ALL THREE lava-mcp images at a released version tag, so a
# deployment pinned to that tag gets a self-consistent set: the server image, the
# interactive board-session image, and the ser2net console-proxy image, all carrying
# the same tag. Push a version tag (e.g. `0.9`) to trigger it; the git tag name becomes
# the image tag (type=ref,event=tag). This does NOT move `latest` — the per-image
# workflows own `latest` on master pushes; this one only adds the versioned tag.

on:
  push:
    tags:
      # release and prerelease version tags, with or without a leading v
      # (e.g. 0.9, 1.0.0, 1.0alpha, 1.0a1, 1.0-rc1, v2.0beta2)
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+[a-z]*[0-9]*'
      - '[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: server
            image: ${{ github.repository }}
            context: .
          - name: interactive
            image: ${{ github.repository }}/interactive
            context: interactive
          - name: ser2net-proxy
            image: ${{ github.repository }}/ser2net-proxy
            context: interactive/ser2net-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          # The git tag name becomes the image tag (e.g. tag `0.9` -> image `:0.9`).
          # `latest` is intentionally NOT emitted here.
          tags: |
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
