name: tests

# Reusable test suite: run the pytest suite on a matrix of supported Python
# versions. Called by the image-build workflows (via `uses:` + `needs:`) so no
# image is published unless the tests pass; also runnable on its own for a
# code/test change that does not rebuild an image, and by hand.

on:
  workflow_call:
  workflow_dispatch:
  # The image-build workflows gate their build on this suite (uses: + needs:), so
  # changes to lava_mcp/** or pyproject.toml already run it there. Trigger it
  # directly only for the paths those workflows do not watch — a test-only change —
  # so editing a test still runs CI without also rebuilding an image.
  push:
    branches: [master]
    paths:
      - tests/**
      - .github/workflows/tests.yml
  pull_request:
    paths:
      - tests/**
      - .github/workflows/tests.yml

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (with dev extras)
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -q
